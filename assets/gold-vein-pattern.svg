<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="islands" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0045 0.0065" numOctaves="5" seed="9" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0" result="gray"/>
      <feComponentTransfer in="gray" result="lvl">
        <feFuncA type="discrete" tableValues="0 0 0 1 1"/>
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="3" result="edge"/>
      <feDisplacementMap in="lvl" in2="edge" scale="34" xChannelSelector="R" yChannelSelector="G" result="mask"/>
      <feGaussianBlur in="mask" stdDeviation="1.5" result="softmask"/>
      <feComposite in="SourceGraphic" in2="softmask" operator="in" result="tinted"/>
      <feGaussianBlur in="tinted" stdDeviation="9" result="glow"/>

      <!-- fine glitter grain, confined to the island shapes -->
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="grain"/>
      <feColorMatrix in="grain" type="matrix"
        values="0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0" result="grainGray"/>
      <feComponentTransfer in="grainGray" result="sparkle">
        <feFuncA type="discrete" tableValues="0 0 0 0 0 0.6 1"/>
      </feComponentTransfer>
      <feFlood flood-color="#fef3c7" result="sparkleColor"/>
      <feComposite in="sparkleColor" in2="sparkle" operator="in" result="sparkleTinted"/>
      <feComposite in="sparkleTinted" in2="softmask" operator="in" result="sparkleFinal"/>

      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="tinted"/>
        <feMergeNode in="sparkleFinal"/>
      </feMerge>
    </filter>
    <linearGradient id="islandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0c" stop-opacity="1"/>
      <stop offset="45%" stop-color="#0a0a0c" stop-opacity="1"/>
      <stop offset="72%" stop-color="#0a0a0c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fadeEdges" cx="62%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#0a0a0c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1000" fill="url(#islandGrad)" filter="url(#islands)" opacity="0.85"/>
  <rect width="1920" height="1000" fill="url(#fadeLeft)"/>
  <rect width="1920" height="1000" fill="url(#fadeEdges)"/>
</svg>
