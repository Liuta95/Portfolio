<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="vein" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.010" numOctaves="4" seed="12" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="180" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="4" result="edgeNoise"/>
      <feDisplacementMap in="warped" in2="edgeNoise" scale="14" xChannelSelector="R" yChannelSelector="G" result="chunky"/>
      <feGaussianBlur in="chunky" stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="chunky"/>
      </feMerge>
    </filter>
    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="sideFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="38%" stop-color="white" stop-opacity="0"/>
      <stop offset="62%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="vFade" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.25"/>
    </radialGradient>
    <mask id="fadeMask">
      <rect width="1920" height="1000" fill="url(#sideFade)"/>
      <rect width="1920" height="1000" fill="url(#vFade)" style="mix-blend-mode:multiply"/>
    </mask>
  </defs>

  <g mask="url(#fadeMask)">
    <g filter="url(#vein)">
      <path d="M 1560 -60 C 1460 140, 1650 300, 1560 480 S 1720 760, 1620 1060"
            stroke="url(#veinGrad)" stroke-width="30" stroke-linecap="round" fill="none" opacity="0.85"/>
      <path d="M 1850 -40 C 1780 220, 1900 380, 1800 600 S 1950 880, 1830 1060"
            stroke="url(#veinGrad)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.5"/>
      <path d="M 1300 1060 C 1400 850, 1320 650, 1450 470 S 1350 200, 1480 -60"
            stroke="url(#veinGrad)" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.4"/>
    </g>
  </g>
</svg>
