<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PetPal cover illustration — a paw print connected by a walking trail to a location pin">
  <defs>
    <radialGradient id="petpalGlow1" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#e879a0"/>
      <stop offset="60%" stop-color="#e879a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="petpalGlow2" cx="20%" cy="92%" r="75%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petpalBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#1e1033"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#petpalBase)"/>
  <rect width="640" height="400" fill="url(#petpalGlow1)"/>
  <rect width="640" height="400" fill="url(#petpalGlow2)"/>

  <!-- trust ring -->
  <circle cx="470" cy="150" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- GPS walking trail from paw to pin -->
  <path d="M172,252 C260,300 320,150 428,163" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- paw print -->
  <g fill="#ffffff" fill-opacity="0.92">
    <ellipse cx="170" cy="262" rx="36" ry="27"/>
    <circle cx="126" cy="214" r="14"/>
    <circle cx="158" cy="190" r="15"/>
    <circle cx="196" cy="190" r="15"/>
    <circle cx="228" cy="214" r="14"/>
  </g>

  <!-- location pin, hollow -->
  <path d="M470,90 C500,90 524,113 524,143 C524,183 470,238 470,238 C470,238 416,183 416,143 C416,113 440,90 470,90 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.88" stroke-width="3"/>
  <circle cx="470" cy="143" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.88" stroke-width="3"/>
</svg>
