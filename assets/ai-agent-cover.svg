<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Agent cover illustration — two overlapping chat panels with a sparkle mark">
  <defs>
    <radialGradient id="aiGlow1" cx="28%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aiGlow2" cx="82%" cy="82%" r="75%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aiBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1b2b"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#aiBase)"/>
  <rect width="640" height="400" fill="url(#aiGlow1)"/>
  <rect width="640" height="400" fill="url(#aiGlow2)"/>

  <!-- back panel -->
  <rect x="140" y="110" width="230" height="140" rx="22" fill="#ffffff" fill-opacity="0.04" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- front panel -->
  <rect x="255" y="185" width="245" height="140" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- typing dots -->
  <circle cx="330" cy="255" r="7" fill="#22d3ee"/>
  <circle cx="362" cy="255" r="7" fill="#38bdf8" fill-opacity="0.85"/>
  <circle cx="394" cy="255" r="7" fill="#60a5fa" fill-opacity="0.65"/>

  <!-- sparkle mark -->
  <path d="M472 78 L481 99 L502 108 L481 117 L472 138 L463 117 L442 108 L463 99 Z" fill="#60a5fa" fill-opacity="0.85"/>
</svg>
