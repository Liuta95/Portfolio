<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Agent dark-mode UI mockup — Welcome screen with sidebar navigation and workflow template cards, framed in a browser window">
  <defs>
    <clipPath id="aiWinClip"><rect x="0" y="0" width="640" height="400" rx="16"/></clipPath>
    <linearGradient id="aiLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="aiCenterGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#aiWinClip)">
    <rect width="640" height="400" fill="#0e0e13"/>
    <ellipse cx="395" cy="180" rx="240" ry="150" fill="url(#aiCenterGlow)"/>

    <!-- browser chrome -->
    <rect width="640" height="26" fill="#16161c"/>
    <circle cx="16" cy="13" r="4" fill="#ff5f57"/>
    <circle cx="30" cy="13" r="4" fill="#febc2e"/>
    <circle cx="44" cy="13" r="4" fill="#28c840"/>

    <!-- sidebar -->
    <rect x="0" y="26" width="150" height="374" fill="#131318"/>
    <line x1="150" y1="26" x2="150" y2="400" stroke="#232329" stroke-width="1"/>

    <rect x="14" y="42" width="20" height="20" rx="6" fill="url(#aiLogoGrad)"/>
    <text x="42" y="56" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#f2f2f5">AI Agent</text>

    <rect x="14" y="72" width="122" height="22" rx="11" fill="none" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="30" y="87" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#c4b5fd">+ New chat</text>

    <text x="14" y="112" font-family="Arial, sans-serif" font-size="9" fill="#9a9aa5">Daily news</text>
    <text x="14" y="130" font-family="Arial, sans-serif" font-size="9" fill="#9a9aa5">History</text>

    <text x="14" y="156" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#6b6b76" letter-spacing="0.5">TOOLS</text>
    <text x="14" y="172" font-family="Arial, sans-serif" font-size="9" fill="#c4b5fd">Text</text>
    <text x="14" y="188" font-family="Arial, sans-serif" font-size="9" fill="#c4b5fd">Slides</text>
    <text x="14" y="204" font-family="Arial, sans-serif" font-size="9" fill="#c4b5fd">Drafting Tool</text>
    <text x="14" y="220" font-family="Arial, sans-serif" font-size="9" fill="#c4b5fd">Build Deck</text>

    <text x="14" y="248" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#6b6b76" letter-spacing="0.5">PROJECTS</text>
    <text x="14" y="264" font-family="Arial, sans-serif" font-size="9" fill="#9a9aa5">New Project</text>
    <text x="14" y="280" font-family="Arial, sans-serif" font-size="9" fill="#9a9aa5">Universal Integrated…</text>

    <circle cx="24" cy="378" r="11" fill="#3b3b45"/>
    <text x="42" y="382" font-family="Arial, sans-serif" font-size="9" fill="#e5e5ea">Anastasiia Liuta</text>

    <!-- center welcome -->
    <text x="395" y="150" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">Welcome, Anastasiia!</text>
    <text x="395" y="176" font-family="Arial, sans-serif" font-size="12" fill="#9a9aa5" text-anchor="middle">Can I help you with anything?</text>

    <rect x="270" y="204" width="250" height="34" rx="17" fill="#1a1a21" stroke="#2a2a32" stroke-width="1"/>
    <text x="286" y="225" font-family="Arial, sans-serif" font-size="10" fill="#6b6b76">Ask me anything…</text>

    <rect x="270" y="246" width="80" height="20" rx="10" fill="#1a1a21" stroke="#2a2a32"/>
    <text x="280" y="260" font-family="Arial, sans-serif" font-size="8" fill="#c9c9d1">Monitor AI releases</text>
    <rect x="270" y="246" width="80" height="20" rx="10" fill="none"/>

    <!-- right rail template cards -->
    <g>
      <rect x="556" y="40" width="70" height="46" rx="8" fill="#1a1a21" stroke="#2a2a32" stroke-width="1"/>
      <rect x="564" y="48" width="14" height="14" rx="4" fill="#3b82f6"/>
      <text x="564" y="74" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#e5e5ea">Competitor</text>
    </g>
    <g>
      <rect x="556" y="94" width="70" height="46" rx="8" fill="#1a1a21" stroke="#2a2a32" stroke-width="1"/>
      <rect x="564" y="102" width="14" height="14" rx="4" fill="#f59e0b"/>
      <text x="564" y="128" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#e5e5ea">Market</text>
    </g>
    <g>
      <rect x="556" y="148" width="70" height="46" rx="8" fill="#1a1a21" stroke="#2a2a32" stroke-width="1"/>
      <rect x="564" y="156" width="14" height="14" rx="4" fill="#22c55e"/>
      <text x="564" y="182" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#e5e5ea">Feedback</text>
    </g>
    <g>
      <rect x="556" y="202" width="70" height="46" rx="8" fill="#1a1a21" stroke="#2a2a32" stroke-width="1"/>
      <rect x="564" y="210" width="14" height="14" rx="4" fill="#ef4444"/>
      <text x="564" y="236" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#e5e5ea">Roadmap</text>
    </g>
    <g>
      <rect x="556" y="256" width="70" height="46" rx="8" fill="#1a1a21" stroke="#2a2a32" stroke-width="1"/>
      <rect x="564" y="264" width="14" height="14" rx="4" fill="#a78bfa"/>
      <text x="564" y="290" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#e5e5ea">Sales</text>
    </g>
  </g>
</svg>
